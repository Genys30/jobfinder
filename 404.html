<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · JobFinder</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Served by Cloudflare Pages (and GitHub Pages) for any unknown path, with a
     real 404 status. Without it Pages falls back to index.html with 200, so
     every typo URL was a soft-404 duplicate of the home page. Absolute paths:
     this page is served at whatever URL was requested. -->
<style>
  :root{--bg:#f5f1e8;--ink:#1a1a17;--ink-dim:#5c5849;--accent:#9a5c00;--rule:#d9d2c2;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:'Carlito','Segoe UI',system-ui,sans-serif;padding:24px 16px;}
  main{max-width:520px;}
  .code{font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;letter-spacing:.2em;color:var(--ink-dim);text-transform:uppercase;}
  h1{font-size:clamp(28px,7vw,44px);font-style:italic;letter-spacing:-.02em;line-height:1.1;margin:10px 0 14px;}
  p{color:var(--ink-dim);line-height:1.6;margin:0 0 22px;}
  a.home{display:inline-block;padding:10px 18px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);text-decoration:none;font-weight:700;}
  a.home:hover{background:var(--accent);color:#fff;}
</style>
</head>
<body>
<main>
  <div class="code">404 · JobFinder</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be mistyped or out of date. Job search, analytics and the about page all live on the home page.</p>
  <a class="home" href="/">Go to job search →</a>
</main>
</body>
</html>
